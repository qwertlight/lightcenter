<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>LightCenter · Панель управления</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#FAFAF7;--white:#fff;
  --gold:#C9943A;--gold-l:#F5E6CC;--gold-p:#FDF7EE;--gold-d:#A87A2F;
  --dark:#1C1C1A;--mid:#5A5A55;--light:#9A9A94;
  --border:#E8E8E2;--soft:#F0F0EA;
  --ok:#2E7D46;--ok-bg:#EAF5EE;--danger:#B4443B;--danger-bg:#FBECEA;
  --fd:'Cormorant',Georgia,serif;--fb:'Outfit',system-ui,sans-serif;
  --radius:12px;--shadow:0 4px 24px rgba(0,0,0,.06);
}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--fb);background:var(--cream);color:var(--dark);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:var(--fb);cursor:pointer}
input,select,textarea{font-family:var(--fb);font-size:15px}
.hidden{display:none!important}

.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.2px}
.brand-dot{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--gold),var(--gold-d));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--fd);font-size:18px;font-weight:600;flex-shrink:0}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:380px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 28px}
.login-card .brand{justify-content:center;margin-bottom:6px;font-size:18px}
.login-sub{text-align:center;color:var(--mid);font-size:13px;margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--mid);margin-bottom:6px}
.field input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--cream);transition:border-color .15s}
.field input:focus{outline:none;border-color:var(--gold);background:var(--white)}
.btn{border:none;border-radius:10px;font-weight:600;transition:transform .08s,background .15s;min-height:46px;padding:0 18px}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--gold);color:#fff;width:100%;font-size:15px}
.btn-primary:hover{background:var(--gold-d)}
.btn-primary:disabled{opacity:.55;cursor:default}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid #F1D5D1}
.btn-danger:hover{background:#F7E0DD}
.msg{font-size:13px;padding:10px 12px;border-radius:9px;margin-bottom:14px}
.msg-err{background:var(--danger-bg);color:var(--danger)}

/* SHELL */
.topbar{position:sticky;top:0;z-index:20;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:12px 20px}
.topbar .brand{font-size:16px}
.topbar .count{color:var(--light);font-size:13px;margin-left:2px}
.topbar .spacer{flex:1}
.btn-ghost{background:transparent;border:1px solid var(--border);border-radius:9px;color:var(--mid);min-height:40px;padding:0 14px;font-size:14px;font-weight:500}
.btn-ghost:hover{border-color:var(--gold);color:var(--dark)}
.btn-add{background:var(--gold);color:#fff;border:none;border-radius:9px;min-height:44px;padding:0 16px;font-weight:600;font-size:14px}
.btn-add:active{transform:scale(.98)}
.wrap{max-width:1100px;margin:0 auto;padding:20px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar input,.toolbar select{padding:11px 13px;border:1px solid var(--border);border-radius:10px;background:var(--white)}
.toolbar input{flex:1;min-width:180px}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--gold)}
.catbar{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;margin-bottom:14px}
.chip{flex-shrink:0;white-space:nowrap;padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--white);font-family:var(--fb);font-size:13px;font-weight:500;color:var(--mid);cursor:pointer;transition:background .15s,border-color .15s;min-height:38px}
.chip:active{transform:scale(.97)}
.chip.active{background:var(--dark);border-color:var(--dark);color:#fff}
.chip .c{opacity:.55;font-size:12px;margin-left:3px}

.bulkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--white);border:1px solid var(--gold-l);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;position:sticky;top:62px;z-index:15}
.bulk-all{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:500}
.bulk-all input{width:18px;height:18px;accent-color:var(--gold)}
.bulk-count{font-size:13px;color:var(--gold-d);font-weight:600}
.bulk-sp{flex:1}
.bulkbar select{padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--cream);font-size:14px;min-height:40px}
.bulkbar select:focus{outline:none;border-color:var(--gold)}
.bulk-del{min-height:40px;border-radius:9px;padding:0 14px;font-size:14px;font-weight:600}
.bulkbar .btn-ghost{min-height:40px}
.row-check{width:20px;height:20px;accent-color:var(--gold);flex-shrink:0;cursor:pointer}
.row.selected{border-color:var(--gold);background:var(--gold-p)}

.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px}
.row.is-hidden{opacity:.55}
.thumb{width:52px;height:52px;border-radius:9px;background:var(--soft);object-fit:cover;flex-shrink:0}
.thumb-ph{width:52px;height:52px;border-radius:9px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--light);font-size:18px;flex-shrink:0}
.row-main{flex:1;min-width:0}
.row-name{font-weight:500;font-size:14px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row-meta{display:flex;gap:8px;align-items:center;margin-top:3px;flex-wrap:wrap}
.tag{font-size:11px;color:var(--gold-d);background:var(--gold-p);border:1px solid var(--gold-l);padding:1px 8px;border-radius:6px}
.tag-off{color:var(--danger);background:var(--danger-bg);border-color:#F1D5D1}
.tag-photos{color:var(--mid);background:var(--soft);border-color:var(--border)}
.row-price{font-weight:600;font-size:15px;white-space:nowrap}
.row-edit{background:var(--dark);color:#fff;border:none;border-radius:9px;min-height:40px;min-width:44px;padding:0 16px;font-size:14px;font-weight:500}
.row-edit:active{transform:scale(.97)}
.empty{text-align:center;color:var(--mid);padding:60px 20px}

/* MODAL */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(28,28,26,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:560px;max-height:94vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--white);border-radius:16px 16px 0 0;transform:translateY(24px);transition:transform .2s}
.overlay.open .sheet{transform:translateY(0)}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--white);display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.sheet-head h2{font-family:var(--fb);font-size:16px;font-weight:600}
.x{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--white);font-size:18px;color:var(--mid);display:flex;align-items:center;justify-content:center}
.sheet-body{padding:20px}

/* PHOTOS */
.photos-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.photos-head label{font-size:12px;font-weight:500;color:var(--mid)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-bottom:10px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:var(--soft)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph-cover{position:absolute;left:4px;top:4px;background:var(--gold);color:#fff;font-size:10px;font-weight:600;padding:1px 6px;border-radius:5px}
.ph-x{position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:6px;border:none;background:rgba(28,28,26,.72);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.ph-star{position:absolute;left:0;right:0;bottom:0;border:none;background:rgba(28,28,26,.72);color:#fff;font-size:11px;padding:4px 0}
.photos-empty{color:var(--light);font-size:13px;padding:18px;text-align:center;border:1px dashed var(--border);border-radius:10px;margin-bottom:10px}
.upload-btn{width:100%;border:1px dashed var(--gold);background:var(--gold-p);color:var(--gold-d);border-radius:10px;min-height:46px;font-weight:600;font-size:14px}
.upload-btn:active{transform:scale(.99)}
.upload-btn:disabled{opacity:.6}
.upload-note{font-size:12px;color:var(--light);margin-top:6px;text-align:center}

.field textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--cream);resize:vertical;min-height:110px;line-height:1.5}
.field select{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--cream)}
.field input[type=text],.field input[type=number]{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--cream)}
.field textarea:focus,.field select:focus,.field input:focus{outline:none;border-color:var(--gold);background:var(--white)}
.hr{height:1px;background:var(--border);margin:18px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--cream);cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--gold)}
.chk span{font-size:14px}
.sheet-foot{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--white)}
.sheet-foot .btn-primary{width:auto;flex:1}
.sheet-foot .btn-ghost,.sheet-foot .btn-danger{flex:0 0 auto;min-height:46px;border-radius:10px}

.cat-add{display:flex;gap:8px;margin-bottom:14px}
.cat-add input{flex:1;padding:11px 13px;border:1px solid var(--border);border-radius:10px;background:var(--cream)}
.cat-add input:focus{outline:none;border-color:var(--gold);background:var(--white)}
.cat-list{display:flex;flex-direction:column;gap:6px}
.cat-row{display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--border);border-radius:10px;padding:6px 8px}
.cat-reorder{display:flex;flex-direction:column;gap:2px}
.cat-reorder button{width:26px;height:20px;border:1px solid var(--border);background:var(--cream);border-radius:5px;font-size:11px;color:var(--mid);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.cat-reorder button:disabled{opacity:.35;cursor:default}
.cat-label{flex:1;min-width:0;padding:9px 11px;border:1px solid transparent;border-radius:8px;background:var(--cream);font-size:14px}
.cat-label:focus{outline:none;border-color:var(--gold);background:var(--white)}
.cat-count{font-size:12px;color:var(--light);white-space:nowrap}
.cat-del{width:34px;height:34px;min-width:34px;border:1px solid #F1D5D1;background:var(--danger-bg);color:var(--danger);border-radius:8px;font-size:14px;display:flex;align-items:center;justify-content:center}

.imp-sum{font-size:14px;margin-bottom:12px;line-height:1.6}
.imp-ok{color:var(--ok);font-weight:600}
.imp-bad{color:var(--danger);font-weight:600}
.imp-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.imp-table{width:100%;border-collapse:collapse;font-size:13px;min-width:420px}
.imp-table th,.imp-table td{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
.imp-table th{background:var(--soft);font-weight:600;position:sticky;top:0}
.imp-errs{margin-top:12px;background:var(--danger-bg);border:1px solid #F1D5D1;border-radius:10px;padding:10px 12px;font-size:13px;color:var(--danger)}
.imp-errs b{display:block;margin-bottom:4px}
.imp-errs div{margin:2px 0}
.imp-hint{font-size:12px;color:var(--light);margin-top:8px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);background:var(--dark);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:500;z-index:80;opacity:0;transition:transform .25s,opacity .25s;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.err{background:var(--danger)}

@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:16px}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="LOGIN">
  <div class="login-card">
    <div class="brand"><span class="brand-dot">L</span>LightCenter</div>
    <p class="login-sub">Панель управления каталогом</p>
    <div class="msg msg-err hidden" id="LOGIN_MSG"></div>
    <div class="field"><label for="EMAIL">Email</label><input type="email" id="EMAIL" autocomplete="username" placeholder="you@example.com"></div>
    <div class="field"><label for="PASS">Пароль</label><input type="password" id="PASS" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn btn-primary" id="LOGIN_BTN">Войти</button>
  </div>
</div>

<!-- APP -->
<div class="hidden" id="APP">
  <header class="topbar">
    <div class="brand"><span class="brand-dot">L</span>LightCenter <span class="count" id="COUNT"></span></div>
    <div class="spacer"></div>
    <button class="btn-ghost" id="CATS_BTN">Категории</button>
    <button class="btn-ghost" id="BACKUP_BTN">Бэкап</button>
    <button class="btn-ghost" id="LOGOUT_BTN">Выйти</button>
  </header>
  <div class="wrap">
    <div class="toolbar">
      <input type="search" id="SEARCH" placeholder="Поиск по названию…">
      <select id="SORT">
        <option value="default">Сортировка: по порядку</option>
        <option value="new">Сначала новые</option>
        <option value="name">Название А–Я</option>
        <option value="price_asc">Цена ↑</option>
        <option value="price_desc">Цена ↓</option>
      </select>
      <button class="btn-ghost" id="IMPORT_BTN">Импорт Excel</button>
      <button class="btn-add" id="ADD_BTN">+ Товар</button>
    </div>
    <div class="catbar" id="CATBAR"></div>
    <div class="bulkbar hidden" id="BULKBAR">
      <label class="bulk-all"><input type="checkbox" id="BULK_ALL"><span>Выбрать все</span></label>
      <span class="bulk-count" id="BULK_COUNT"></span>
      <div class="bulk-sp"></div>
      <select id="BULK_CAT"><option value="">Перенести в категорию…</option></select>
      <button class="btn-ghost" id="BULK_PRICE">Цены</button>
      <button class="btn-ghost" id="BULK_TOP">↑ Наверх</button>
      <button class="btn-danger bulk-del" id="BULK_DEL">Удалить</button>
      <button class="btn-ghost" id="BULK_CLEAR">Снять</button>
    </div>
    <input type="file" id="XLS_FILE" accept=".xlsx" class="hidden">
    <div class="list" id="LIST"></div>
  </div>
</div>

<!-- EDIT / CREATE SHEET -->
<div class="overlay" id="EDIT">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="EDIT_TITLE">Изменить товар</h2>
      <button class="x" id="EDIT_X" aria-label="Закрыть">✕</button>
    </div>
    <div class="sheet-body">
      <!-- Фото -->
      <div class="photos-head"><label>Фото <span id="PH_COUNT" style="color:var(--light)"></span></label></div>
      <div class="photos hidden" id="F_PHOTOS"></div>
      <div class="photos-empty" id="F_PHOTOS_EMPTY">Фото пока нет. Первое загруженное станет обложкой в каталоге.</div>
      <input type="file" id="F_FILE" accept="image/*" multiple class="hidden">
      <button class="upload-btn" id="UPLOAD_BTN">＋ Загрузить фото</button>
      <div class="upload-note" id="UPLOAD_NOTE"></div>

      <div class="hr"></div>

      <div class="field"><label for="F_NAME">Название</label><input type="text" id="F_NAME"></div>
      <div class="grid2">
        <div class="field"><label for="F_PRICE">Цена, ₸</label><input type="number" id="F_PRICE" min="0" step="1" inputmode="numeric"></div>
        <div class="field"><label for="F_UNIT">Единица</label><input type="text" id="F_UNIT" placeholder="шт"></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="F_CAT">Категория</label><select id="F_CAT"></select></div>
        <div class="field"><label for="F_BADGE">Метка</label>
          <select id="F_BADGE">
            <option value="">Без метки</option>
            <option value="new">Новинка</option>
            <option value="sale">Акция</option>
            <option value="hit">Хит</option>
          </select>
        </div>
      </div>
      <div class="field"><label for="F_DESC">Описание</label><textarea id="F_DESC"></textarea></div>
      <label class="chk" for="F_ACTIVE"><input type="checkbox" id="F_ACTIVE" checked><span>Показывать на сайте</span></label>
    </div>
    <div class="sheet-foot">
      <button class="btn-danger hidden" id="DELETE_BTN">Удалить</button>
      <button class="btn-ghost hidden" id="DUP_BTN">Дублировать</button>
      <button class="btn-ghost" id="EDIT_CANCEL">Отмена</button>
      <button class="btn btn-primary" id="EDIT_SAVE">Сохранить</button>
    </div>
  </div>
</div>

<!-- CATEGORIES SHEET -->
<div class="overlay" id="CATMODAL">
  <div class="sheet">
    <div class="sheet-head">
      <h2>Категории</h2>
      <button class="x" id="CAT_X" aria-label="Закрыть">✕</button>
    </div>
    <div class="sheet-body">
      <div class="cat-add">
        <input type="text" id="CAT_NEW" placeholder="Новая категория, напр. «Умный свет»">
        <button class="btn-add" id="CAT_ADD">Добавить</button>
      </div>
      <div class="cat-list" id="CAT_LIST_M"></div>
    </div>
    <div class="sheet-foot">
      <button class="btn-ghost" id="CAT_CLOSE" style="flex:1">Готово</button>
    </div>
  </div>
</div>

<!-- IMPORT SHEET -->
<div class="overlay" id="IMPORTMODAL">
  <div class="sheet">
    <div class="sheet-head">
      <h2>Импорт из Excel</h2>
      <button class="x" id="IMP_X" aria-label="Закрыть">✕</button>
    </div>
    <div class="sheet-body">
      <div class="imp-sum" id="IMP_SUM"></div>
      <div class="imp-wrap"><table class="imp-table" id="IMP_TABLE"></table></div>
      <div class="imp-errs hidden" id="IMP_ERRS"></div>
      <div class="imp-hint" id="IMP_HINT"></div>
    </div>
    <div class="sheet-foot">
      <button class="btn-ghost" id="IMP_CANCEL">Отмена</button>
      <button class="btn btn-primary" id="IMP_DO">Импортировать</button>
    </div>
  </div>
</div>

<!-- PRICE SHEET -->
<div class="overlay" id="PRICEMODAL">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="PRICE_TITLE">Изменить цены</h2>
      <button class="x" id="PRICE_X" aria-label="Закрыть">✕</button>
    </div>
    <div class="sheet-body">
      <div class="field">
        <label for="PRICE_OP">Что сделать</label>
        <select id="PRICE_OP">
          <option value="pct_up">Повысить на %</option>
          <option value="pct_down">Понизить на %</option>
          <option value="add">Прибавить ₸</option>
          <option value="sub">Вычесть ₸</option>
        </select>
      </div>
      <div class="field">
        <label for="PRICE_VAL">Значение</label>
        <input type="number" id="PRICE_VAL" min="0" step="1" inputmode="numeric" placeholder="напр. 10">
      </div>
      <div class="field">
        <label for="PRICE_ROUND">Округление</label>
        <select id="PRICE_ROUND">
          <option value="1">Без округления</option>
          <option value="10">До 10 ₸</option>
          <option value="100" selected>До 100 ₸</option>
          <option value="1000">До 1000 ₸</option>
        </select>
      </div>
      <div class="imp-wrap"><table class="imp-table" id="PRICE_PREVIEW"></table></div>
      <div class="imp-hint" id="PRICE_HINT"></div>
    </div>
    <div class="sheet-foot">
      <button class="btn-ghost" id="PRICE_CANCEL">Отмена</button>
      <button class="btn btn-primary" id="PRICE_APPLY">Применить</button>
    </div>
  </div>
</div>

function fileExt(name){var m=/\.([a-zA-Z0-9]+)$/.exec(name||'');return m?m[1].toLowerCase():'jpg';}
async function handleFiles(files){
  if(!files||!files.length)return;
  var btn=$('UPLOAD_BTN');btn.disabled=true;
  var ok=0,fail=0;
  for(var i=0;i<files.length;i++){

    var path=url.substring(idx+marker.length).split('?')[0];
    sb.storage.from(BUCKET).remove([path]); // фоново, не ждём

// ══ КАТЕГОРИИ ══
var TRANSLIT={'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'c','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
function translit(s){var o='';s=String(s).toLowerCase();for(var i=0;i<s.length;i++){o+=(TRANSLIT[s[i]]!==undefined?TRANSLIT[s[i]]:s[i]);}return o;}
function slugify(label){var s=translit(label).replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');return s||'cat';}
function uniqueSlug(base){var have={};cats.forEach(function(c){have[c.slug]=1;});var s=base,n=2;while(have[s]){s=base+'_'+n;n++;}return s;}
function catProductCount(slug){var n=0;for(var i=0;i<products.length;i++)if(products[i].cat===slug)n++;return n;}

function openCatManager(){renderCatManager();$('CATMODAL').classList.add('open');lockScroll(true);}
function closeCatManager(){$('CATMODAL').classList.remove('open');lockScroll(false);}
function renderCatManager(){
  var el=$('CAT_LIST_M'),h='';
  for(var i=0;i<cats.length;i++){
    var c=cats[i],cnt=catProductCount(c.slug);
    h+='<div class="cat-row">'
      +'<div class="cat-reorder"><button data-up="'+i+'"'+(i===0?' disabled':'')+' aria-label="Выше">↑</button><button data-down="'+i+'"'+(i===cats.length-1?' disabled':'')+' aria-label="Ниже">↓</button></div>'
      +'<input class="cat-label" data-slug="'+esc(c.slug)+'" value="'+esc(c.label)+'">'
      +'<span class="cat-count">'+cnt+' тов.</span>'
      +'<button class="cat-del" data-del="'+esc(c.slug)+'" aria-label="Удалить">✕</button>'
      +'</div>';
  }
  el.innerHTML=h;
}
async function addCategory(){

}

}
async function deleteCategory(slug){

  if(cnt>0){toast('Нельзя удалить: в категории '+cnt+' товаров. Сначала перенесите их.',true);return;}
  var c=cats.find(function(x){return x.slug===slug;});
  if(!window.confirm('Удалить категорию «'+(c?c.label:slug)+'»?'))return;
  try{
    var res=await sb.from('categories').delete().eq('slug',slug);
    if(res.error)throw res.error;
    await loadCategories();renderCatManager();
    toast('Категория удалена');

}
async function moveCategory(i,dir){
  var j=i+dir;if(j<0||j>=cats.length)return;
  var a=cats[i],b=cats[j],tmp=a.sort_order;a.sort_order=b.sort_order;b.sort_order=tmp;
  try{
    await Promise.all([
      sb.from('categories').update({sort_order:a.sort_order}).eq('slug',a.slug),
      sb.from('categories').update({sort_order:b.sort_order}).eq('slug',b.slug)
    ]);

  }catch(e){toast('Не удалось изменить порядок',true);await loadCategories();renderCatManager();}

// ══ ИМПОРТ EXCEL ══
var importRows = [];
function labelToSlugMap(){ var m={}; cats.forEach(function(c){ m[String(c.label).toLowerCase().trim()]=c.slug; }); return m; }
function badgeToCode(v){ v=String(v||'').toLowerCase(); if(v.indexOf('новин')!==-1)return 'new'; if(v.indexOf('акци')!==-1)return 'sale'; if(v.indexOf('хит')!==-1)return 'hit'; return ''; }
function colIndexes(hdr){
  var idx={};
  for(var i=0;i<hdr.length;i++){
    var t=String(hdr[i]||'').toLowerCase();
    if(t.indexOf('назван')!==-1&&idx.name===undefined)idx.name=i;
    else if(t.indexOf('цена')!==-1&&idx.price===undefined)idx.price=i;
    else if(t.indexOf('категор')!==-1&&idx.cat===undefined)idx.cat=i;
    else if(t.indexOf('единиц')!==-1&&idx.unit===undefined)idx.unit=i;
    else if(t.indexOf('описан')!==-1&&idx.desc===undefined)idx.desc=i;
    else if(t.indexOf('метк')!==-1&&idx.badge===undefined)idx.badge=i;
    else if(t.indexOf('фото')!==-1&&idx.images===undefined)idx.images=i;
  }
  return idx;
}
async function handleXls(file){
  if(!file)return;
  if(typeof XLSX==='undefined'){ toast('Компонент чтения Excel не загрузился. Обновите страницу.',true); return; }
  try{
    var buf=await file.arrayBuffer();
    var wb=XLSX.read(buf,{type:'array'});
    var sn=wb.SheetNames.indexOf('Товары')!==-1?'Товары':wb.SheetNames[0];
    var rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
    parseRows(rows);
  }catch(e){ toast('Не удалось прочитать файл',true); }
  $('XLS_FILE').value='';
}
function parseRows(rows){
  if(!rows||rows.length<2){ toast('В файле нет строк с товарами',true); return; }
  var idx=colIndexes(rows[0]);
  if(idx.name===undefined||idx.price===undefined||idx.cat===undefined){
    toast('Не найдены колонки Название / Цена / Категория',true); return;
  }
  var l2s=labelToSlugMap();
  var valid=[], errors=[], base=maxSort();
  for(var r=1;r<rows.length;r++){
    var row=rows[r]||[];
    var name=String(row[idx.name]!=null?row[idx.name]:'').trim();
    var priceRaw=String(row[idx.price]!=null?row[idx.price]:'').trim();
    var clabel=String(row[idx.cat]!=null?row[idx.cat]:'').trim();
    if(!name && !priceRaw && !clabel) continue; // пустая строка
    var prob=[];
    if(name.length<2)prob.push('нет названия');
    var price=parseInt(priceRaw.replace(/[^\d]/g,''),10);
    if(isNaN(price)||price<0)prob.push('цена');
    var slug=l2s[clabel.toLowerCase()];
    if(!slug)prob.push('категория «'+clabel+'»');
    if(prob.length){ errors.push({row:r+1,name:name||'(без названия)',why:prob.join(', ')}); continue; }
    var unit=(idx.unit!==undefined?String(row[idx.unit]||'').trim():'')||'шт';
    var desc=idx.desc!==undefined?String(row[idx.desc]||'').trim():'';
    var badge=idx.badge!==undefined?badgeToCode(row[idx.badge]):'';
    var imgs=[];
    if(idx.images!==undefined)imgs=String(row[idx.images]||'').split(',').map(function(s){return s.trim();}).filter(function(s){return /^https?:\/\//i.test(s);});
    valid.push({name:name,price:price,cat:slug,unit:unit,badge:badge,description:desc,active:true,images:imgs,img:imgs[0]||'',sort_order:base+(valid.length+1)*10});
  }
  importRows=valid;
  showImportPreview(valid,errors);
}
function showImportPreview(valid,errors){
  $('IMP_SUM').innerHTML='Готово к импорту: <span class="imp-ok">'+valid.length+'</span>'
    +(errors.length?(' · с ошибками (пропущены): <span class="imp-bad">'+errors.length+'</span>'):'');
  var t=$('IMP_TABLE');
  if(valid.length){
    var h='<tr><th>Название</th><th>Цена</th><th>Категория</th><th>Фото</th></tr>';
    var lim=Math.min(valid.length,80);
    for(var i=0;i<lim;i++){var p=valid[i];h+='<tr><td>'+esc(p.name)+'</td><td>'+fmtPrice(p.price)+'</td><td>'+esc(catLabel[p.cat]||p.cat)+'</td><td>'+(p.images.length||'—')+'</td></tr>';}
    t.innerHTML=h;
    $('IMP_HINT').textContent=valid.length>80?('Показаны первые 80 из '+valid.length+'. Импортируются все.'):'';
  }else{ t.innerHTML=''; $('IMP_HINT').textContent=''; }
  var e=$('IMP_ERRS');
  if(errors.length){
    var eh='<b>Строки с ошибками — не будут импортированы:</b>';
    var elim=Math.min(errors.length,40);
    for(var j=0;j<elim;j++)eh+='<div>Строка '+errors[j].row+': '+esc(errors[j].name)+' — '+esc(errors[j].why)+'</div>';
    if(errors.length>40)eh+='<div>…и ещё '+(errors.length-40)+'</div>';
    e.innerHTML=eh; e.classList.remove('hidden');
  }else e.classList.add('hidden');
  $('IMP_DO').disabled=!valid.length;
  $('IMP_DO').textContent=valid.length?('Импортировать '+valid.length):'Импортировать';
  $('IMPORTMODAL').classList.add('open'); lockScroll(true);
}
function closeImport(){ $('IMPORTMODAL').classList.remove('open'); lockScroll(false); }
async function doImport(){
  if(!importRows.length)return;
  var btn=$('IMP_DO');btn.disabled=true;btn.textContent='Импорт…';
  try{
    var res=await sb.from('products').insert(importRows).select();
    if(res.error)throw res.error;
    await reloadProducts();
    closeImport();
    toast('Импортировано: '+importRows.length);
    importRows=[];
  }catch(e){ toast('Ошибка импорта. Проверьте данные и попробуйте снова.',true); btn.disabled=false; btn.textContent='Импортировать'; }
}

// ══ МАССОВЫЕ ОПЕРАЦИИ ══
function selectedIds(){var a=[];for(var k in selected)if(selected[k])a.push(parseInt(k,10));return a;}
function clearSelection(){selected={};renderList();}
function updateBulkBar(){
  var ids=selectedIds(), bar=$('BULKBAR');
  if(!ids.length){bar.classList.add('hidden');$('BULK_ALL').checked=false;return;}
  bar.classList.remove('hidden');
  $('BULK_COUNT').textContent='Выбрано: '+ids.length;
  var allVisible=visibleIds.length>0&&visibleIds.every(function(id){return selected[id];});
  $('BULK_ALL').checked=allVisible;
}
function toggleSel(id,on){ if(on)selected[id]=true; else delete selected[id]; }
function toggleAllVisible(on){
  for(var i=0;i<visibleIds.length;i++)toggleSel(visibleIds[i],on);
  renderList();
}
async function bulkMove(slug){
  var ids=selectedIds();
  if(!ids.length||!slug)return;
  var c=cats.find(function(x){return x.slug===slug;});
  if(!window.confirm('Перенести '+ids.length+' товаров в категорию «'+(c?c.label:slug)+'»?')){$('BULK_CAT').value='';return;}
  var sel=$('BULK_CAT');sel.disabled=true;
  try{
    var res=await sb.from('products').update({cat:slug}).in('id',ids).select();
    if(res.error)throw res.error;
    selected={};
    await reloadProducts();
    toast('Перенесено: '+ids.length);
  }catch(e){toast('Не удалось перенести. Попробуйте ещё раз.',true);}
  finally{sel.disabled=false;sel.value='';}
}
async function bulkDelete(){
  var ids=selectedIds();
  if(!ids.length)return;
  if(!window.confirm('Удалить '+ids.length+' товаров? Это действие необратимо.\n\nСовет: сначала сделайте бэкап.'))return;
  var btn=$('BULK_DEL');btn.disabled=true;btn.textContent='Удаление…';
  try{
    // соберём фото удаляемых товаров, чтобы подчистить хранилище
    var doomed=products.filter(function(p){return ids.indexOf(p.id)!==-1;});
    var res=await sb.from('products').delete().in('id',ids);
    if(res.error)throw res.error;
    doomed.forEach(function(p){imagesOf(p).forEach(removePhotoFromStorage);});
    selected={};
    await reloadProducts();
    toast('Удалено: '+ids.length);
  }catch(e){toast('Не удалось удалить. Попробуйте ещё раз.',true);}
  finally{btn.disabled=false;btn.textContent='Удалить';}
}

// ══ ДУБЛИРОВАНИЕ ТОВАРА ══
async function duplicateProduct(){
  if(editingId==null)return;
  var p=products.find(function(x){return x.id===editingId;});
  if(!p)return;
  var btn=$('DUP_BTN');btn.disabled=true;btn.textContent='Копирую…';
  try{
    var copy={
      name:(p.name||'')+' (копия)', price:p.price, cat:p.cat, unit:p.unit,
      badge:p.badge||'', description:p.description||'', active:p.active!==false,
      images:(p.images||[]).slice(), img:p.img||'', sort_order:(p.sort_order||0)+1
    };
    var res=await sb.from('products').insert(copy).select();
    if(res.error)throw res.error;
    await reloadProducts();
    toast('Копия создана — отредактируйте её');
    // сразу открываем копию для правки
    if(res.data&&res.data[0])openEdit(res.data[0].id);
  }catch(e){toast('Не удалось создать копию',true);}
  finally{btn.disabled=false;btn.textContent='Дублировать';}
}

// ══ МАССОВОЕ ИЗМЕНЕНИЕ ЦЕН ══
function roundTo(v,step){ step=parseInt(step,10)||1; return Math.max(0,Math.round(v/step)*step); }
function calcNewPrice(old){
  var op=$('PRICE_OP').value, val=parseFloat($('PRICE_VAL').value)||0, step=$('PRICE_ROUND').value;
  var n=old;
  if(op==='pct_up')n=old*(1+val/100);
  else if(op==='pct_down')n=old*(1-val/100);
  else if(op==='add')n=old+val;
  else if(op==='sub')n=old-val;
  return roundTo(n,step);
}
function openPriceModal(){
  var ids=selectedIds(); if(!ids.length)return;
  $('PRICE_TITLE').textContent='Изменить цены — '+ids.length+' товаров';
  $('PRICE_VAL').value='';
  renderPricePreview();
  $('PRICEMODAL').classList.add('open');lockScroll(true);
}
function closePriceModal(){$('PRICEMODAL').classList.remove('open');lockScroll(false);}
function renderPricePreview(){
  var ids=selectedIds();
  var list=products.filter(function(p){return ids.indexOf(p.id)!==-1;});
  var h='<tr><th>Товар</th><th>Было</th><th>Станет</th></tr>';
  var lim=Math.min(list.length,20);
  for(var i=0;i<lim;i++){
    var p=list[i], np=calcNewPrice(p.price);
    h+='<tr><td>'+esc(p.name)+'</td><td>'+fmtPrice(p.price)+'</td><td><b>'+fmtPrice(np)+'</b></td></tr>';
  }
  $('PRICE_PREVIEW').innerHTML=h;
  $('PRICE_HINT').textContent=list.length>20?('Показаны первые 20 из '+list.length+'. Изменятся все.'):'';
}
async function applyPriceChange(){
  var ids=selectedIds(); if(!ids.length)return;
  var val=parseFloat($('PRICE_VAL').value);
  if(isNaN(val)||val<0){toast('Укажите значение',true);return;}
  var list=products.filter(function(p){return ids.indexOf(p.id)!==-1;});
  if(!window.confirm('Изменить цены у '+list.length+' товаров?'))return;
  var btn=$('PRICE_APPLY');btn.disabled=true;btn.textContent='Применяю…';
  try{
    var fails=0;
    for(var i=0;i<list.length;i++){
      var np=calcNewPrice(list[i].price);
      var r=await sb.from('products').update({price:np}).eq('id',list[i].id);
      if(r.error)fails++;
      btn.textContent='Применяю… '+(i+1)+'/'+list.length;
    }
    selected={};
    await reloadProducts();
    closePriceModal();
    toast(fails?('Изменено с ошибками: '+fails):'Цены обновлены: '+list.length, fails>0);
  }catch(e){toast('Не удалось изменить цены',true);}
  finally{btn.disabled=false;btn.textContent='Применить';}
}

// ══ ПОДНЯТЬ НАВЕРХ ══
async function bulkMoveTop(){
  var ids=selectedIds(); if(!ids.length)return;
  var minSort=0;
  for(var i=0;i<products.length;i++){var s=products[i].sort_order||0; if(s<minSort)minSort=s;}
  // сохраняем взаимный порядок выбранных
  var list=products.filter(function(p){return ids.indexOf(p.id)!==-1;});
  var btn=$('BULK_TOP');btn.disabled=true;btn.textContent='Поднимаю…';
  try{
    for(var j=list.length-1,step=1;j>=0;j--,step++){
      await sb.from('products').update({sort_order:minSort-step*10}).eq('id',list[j].id);
    }
    selected={};
    await reloadProducts();
    toast('Поднято наверх: '+list.length);
  }catch(e){toast('Не удалось изменить порядок',true);}
  finally{btn.disabled=false;btn.textContent='↑ Наверх';}
}

// ══ БЭКАП КАТАЛОГА ══
function pad2(n){return n<10?'0'+n:''+n;}
function stamp(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+'_'+pad2(d.getHours())+'-'+pad2(d.getMinutes());}
function downloadBlob(blob,filename){
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}
async function makeBackup(){
  var btn=$('BACKUP_BTN');btn.disabled=true;btn.textContent='Выгрузка…';
  try{
    // берём свежие данные прямо из базы, а не из экрана
    var pr=await sb.from('products').select('*').order('sort_order');
    if(pr.error)throw pr.error;
    var cr=await sb.from('categories').select('*').order('sort_order');
    if(cr.error)throw cr.error;

    var backup={
      сайт:'LightCenter.kz',
      дата:new Date().toLocaleString('ru-RU'),
      версия:1,
      всего_товаров:(pr.data||[]).length,
      всего_категорий:(cr.data||[]).length,
      categories:cr.data||[],
      products:pr.data||[]
    };
    downloadBlob(new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),
                 'lightcenter-backup-'+stamp()+'.json');

    // дополнительно — читаемая таблица Excel.
    // Пауза: браузеры блокируют два скачивания подряд с одной страницы.
    if(typeof XLSX!=='undefined'){
      var rows=(pr.data||[]).map(function(p){
        return {
          'ID':p.id,
          'Название':p.name,
          'Цена':p.price,
          'Категория':catLabel[p.cat]||p.cat,
          'Код категории':p.cat,
          'Единица':p.unit,
          'Описание':p.description||'',
          'Метка':p.badge||'',
          'Показывать':p.active?'да':'нет',
          'Фото':(p.images&&p.images.length?p.images:(p.img?[p.img]:[])).join(', ')
        };
      });
      var cats_rows=(cr.data||[]).map(function(c){
        return {'Категория':c.label,'Код':c.slug,'Порядок':c.sort_order};
      });
      setTimeout(function(){
        try{
          var wb=XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Товары');
          XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(cats_rows),'Категории');
          XLSX.writeFile(wb,'lightcenter-backup-'+stamp()+'.xlsx');
          toast('Excel-копия тоже скачана');
        }catch(e){
          toast('Excel-копию скачать не удалось, основной .json сохранён',true);
        }
      },1500);
    }
    toast('Бэкап .json готов: '+(pr.data||[]).length+' товаров');
  }catch(e){
    toast('Не удалось сделать бэкап. Попробуйте ещё раз.',true);
  }finally{
    btn.disabled=false;btn.textContent='Бэкап';
  }
}

// ══ СОБЫТИЯ ══

$('PASS').addEventListener('keydown',function(e){if(e.key==='Enter')handleLogin();});
